# Bygger Docker-avbilden och publicerar den på GitHub Container Registry
# vid varje ändring i main. Unraid hämtar sedan ghcr.io/claudemicro222-cmd/diskoteket:latest
name: Bygg Docker-avbild

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:          # ändringar i bara dokumentation bygger ingen ny avbild
      - "**.md"
      - "unraid/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Logga in på ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Taggar
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Bygg och publicera
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
