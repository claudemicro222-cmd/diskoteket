<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg">
  <link rel="apple-touch-icon" href="/static/icon-180.png">
  <title>Diskoteket</title>
  <script>
    // Tema direkt, innan sidan ritas, så att den inte blinkar vitt/svart
    try { const t = JSON.parse(localStorage.getItem("theme")); if (t && t !== "auto") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div class="top">
      <a class="brand" href="#" id="brand" aria-label="Diskoteket – till början">
        <img src="/static/icon.svg" alt="">
        <span class="logo">Disk<span class="logo-o" aria-hidden="true"></span><span class="sr">o</span>teket</span>
      </a>
      <button id="btn-lib" class="lib-btn" aria-label="Byt samling"><span id="lib-name">…</span><span class="caret">▾</span></button>
      <button id="btn-random" class="icon" aria-label="Slumpa en film" title="Slumpa en film">
        <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8.5" cy="8.5" r="1.6" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg></button>
      <button id="btn-view" class="icon" aria-label="Visning och tema" title="Visning och tema">
        <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path fill="currentColor" d="M3 3h8v8H3zm10 0h8v8h-8zM3 13h8v8H3zm10 0h8v8h-8z" opacity=".9"/></svg></button>
      <button id="btn-menu" class="icon" aria-label="Meny" title="Meny">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
    </div>
    <div class="row tight">
      <div class="search-box">
        <svg class="search-ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5 20 20" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        <input id="q" type="search" placeholder="Sök titel…" autocomplete="off">
        <select id="q-field" aria-label="Sök i">
          <option value="title">Titel</option>
          <option value="actors">Skådespelare</option>
          <option value="director">Regissör</option>
          <option value="all">Allt</option>
        </select>
      </div>
      <button id="btn-filter" class="btn filter-btn">Filter</button>
    </div>
    <nav id="tabs">
      <button data-tab="all" class="on">Alla</button>
      <button data-tab="movie">Filmer</button>
      <button data-tab="tv">Serier</button>
      <button data-tab="music">Musik</button>
      <button data-tab="wish">Önskelista</button>
    </nav>
    <div id="active-filters"></div>
  </header>

  <section id="shelf" hidden></section>
  <div id="count" class="muted small"></div>
  <main id="grid"></main>
  <p id="empty" class="muted center" hidden></p>
  <nav id="az" hidden aria-label="Hoppa till bokstav"></nav>
  <div id="az-bubble" hidden></div>
  <div id="select-bar" hidden></div>
  <div id="offline" hidden>Offline – du ser en sparad kopia av samlingen</div>

  <button id="btn-scan" class="fab" aria-label="Skanna streckkod" title="Skanna streckkod">
    <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path fill="currentColor" d="M9.4 4 8 6H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3l-1.4-2zM12 8.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9m0 2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5"/></svg>
  </button>
  <div id="toast" hidden></div>

  <!-- Bottenark som återanvänds för alla vyer -->
  <div id="sheet-bg" hidden></div>
  <section id="sheet" hidden>
    <button class="icon back" id="sheet-back" aria-label="Tillbaka" hidden>‹</button>
    <button class="icon close" id="sheet-close" aria-label="Stäng">✕</button>
    <div id="sheet-body"></div>
  </section>

  <script src="/static/i18n.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
