<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <link rel="icon" href="/static/icon.svg">
  <link rel="apple-touch-icon" href="/static/icon-180.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>Logga in – Diskoteket</title>
  <script>
    try { const t = JSON.parse(localStorage.getItem("theme")); if (t && t !== "auto") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
  <form class="login-card" id="login">
    <img src="/static/icon.svg" alt="" class="login-icon">
    <h1 class="logo big">Disk<span class="logo-o" aria-hidden="true"></span><span class="sr">o</span>teket</h1>
    <p class="muted">Logga in för att se samlingen.</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Lösenord" autofocus required>
    <button class="btn primary big" type="submit">Logga in</button>
    <p id="msg" class="bad-text small" hidden></p>
    <p class="muted small">Glömt lösenordet? Ta bort filen <code>auth.json</code> i appdata-mappen och starta om containern.</p>
  </form>
  <script src="/static/i18n.js"></script>
  <script>
    document.getElementById("login").onsubmit = async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      msg.hidden = true;
      const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: document.getElementById("pw").value }) });
      if (r.ok) return location.replace("/");
      msg.textContent = "Fel lösenord – försök igen.";
      msg.hidden = false;
      document.getElementById("pw").select();
    };
  </script>
</body>
</html>
