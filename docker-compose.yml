# För test på en vanlig dator (t.ex. i VM:en med Docker Desktop).
# På Unraid används mallen i unraid/ i stället – se README.
#
# Uppdatera till senaste versionen:   docker compose pull && docker compose up -d
services:
  diskoteket:
    image: ghcr.io/claudemicro222-cmd/diskoteket:latest
    container_name: diskoteket
    ports:
      - "8080:8080"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Stockholm
    volumes:
      - ./data:/config    # databas, omslag, säkerhetskopior och inställningar
    restart: unless-stopped
